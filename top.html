<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINTAGE — Топ гравців</title><link rel="stylesheet" href="style.css?v=30"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><canvas id="particles"></canvas><div class="background"></div><div class="overlay"></div><div class="world-fog"></div><div class="vignette"></div><div class="cursor-glow"></div><div class="interactive-grid"></div><div class="interactive-orb orb-one"></div><div class="interactive-orb orb-two"></div><header class="navbar"><a class="brand" href="index.html"><img src="assets/logo.png" alt="VINTAGE"><span>VINTAGE</span></a><nav id="site-nav"><a href="index.html">Головна</a><a href="index.html#about">Про сервер</a><a href="top.html" class="active">Топ</a><a href="guide.html">Гайд</a><a href="whitelist.html">Whitelist</a><a href="chat.html">Чат</a><a href="profile.html">Кабінет</a><a id="admin-nav" href="admin.html" class="hidden">Гравці</a></nav><div id="nav-auth"></div><button id="mobile-menu" class="mobile-menu" aria-label="Відкрити меню">☰</button></header><main class="page-main narrow-page"><section class="account-area"><div class="section-tag">07 — COMMUNITY</div><h1>ТОП <span>ГРАВЦІВ</span></h1><p class="section-description">Статистика VINTAGE: час на сервері, вбивства, моби та активність.</p><div id="top-players" class="top-grid"><div class="empty-state">Завантаження…</div></div></section></main><div id="toast-container" class="toast-container" aria-live="polite"></div><footer><p>© 2026 VINTAGE Server</p></footer><script src="script.js?v=30"></script><script>window.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('top-players');const {data,error}=await supabaseClient.rpc('get_top_players',{p_limit:30});if(error){box.innerHTML='<div class="empty-state">'+escapeHTML(error.message)+'</div>';return}const fmt=t=>{const sec=Math.floor(Number(t||0)/20),d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60);return d?`${d} дн ${h} год`:h?`${h} год ${m} хв`:`${m} хв`};box.innerHTML=(data||[]).map((p,i)=>`<article class="top-card"><div class="top-rank">#${i+1}</div><h3>${escapeHTML(p.username||'Гравець')}</h3><div class="mc">${escapeHTML(p.minecraft_nickname||'Minecraft-нік не вказано')}</div><div class="top-metrics"><div><small>ЧАС</small><b>${fmt(p.play_time_ticks)}</b></div><div><small>ВБИВСТВА</small><b>${Number(p.player_kills||0)}</b></div><div><small>МОБИ</small><b>${Number(p.mob_kills||0)}</b></div><div><small>СМЕРТІ</small><b>${Number(p.deaths||0)}</b></div></div></article>`).join('')||'<div class="empty-state">Статистика ще не зібрана.</div>';});</script></body></html>
